<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="{% block description %}Marc Leonard is a software developer with 15+ years in media and entertainment, on the Ingest and Processing team at Mux.{% endblock %}">
    <meta name="author" content="Marc R Leonard">

    <title>{% block title %}Marc R Leonard | Developer{% endblock %}</title>
    <link rel="icon" href="{{ root }}/favicon.ico">
    <link rel="alternate" type="application/rss+xml" title="Marc Leonard" href="{{ root }}/rss.xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..800&family=IBM+Plex+Mono:wght@400;500&display=swap">

    <link rel="stylesheet" href="{{ root }}/css/site.css">
    <link rel="stylesheet" href="{{ root }}/css/pygment.css">

    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-C2F6FPRGES"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-C2F6FPRGES');
    </script>
</head>

<body>
{% set active = nav_active or page_slug %}
<header class="site-head" id="head">
    <div class="wrap">
        <div class="logo"><a href="{{ root }}/">marc leonard</a></div>
        <nav>
            {%- for url, title, _ in nav_items %}
            {%- if url == active %}<span aria-current="page">{{ title }}</span>{% else %}<a href="{{ root }}{{ url }}">{{ title }}</a>{% endif %}
            {%- endfor %}
        </nav>
    </div>
</header>

<main{% block main_attrs %}{% endblock %}>
{% block content %}{% endblock %}
</main>

<footer class="foot">
    <div class="wrap">
        <span class="who">Marc Leonard · Bozeman, MT</span>
        <nav>
            <a href="https://www.linkedin.com/in/marc-leonard/">LinkedIn</a>
            <a href="https://github.com/marcrleonard">GitHub</a>
            <a href="{{ root }}/resume">Résumé</a>
            <a href="{{ root }}/rss.xml">RSS</a>
        </nav>
    </div>
</footer>

<script>
    // hairline under the header once the page has scrolled
    const head = document.getElementById("head");
    const onScroll = () => head.classList.toggle("scrolled", scrollY > 8);
    addEventListener("scroll", onScroll, { passive: true });
    onScroll();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
